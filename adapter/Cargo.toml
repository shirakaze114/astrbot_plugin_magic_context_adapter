[package]
name = "mc-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mc-module = { path = "../magic-context/crates/mc-module" }
mc-store = { path = "../magic-context/crates/mc-store", features = ["test-support"] }
cortexkit-store-types = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
