[package]
name = "mc-adapter"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
subc-client-rs = "=0.26.1"
subc-protocol = "=0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
